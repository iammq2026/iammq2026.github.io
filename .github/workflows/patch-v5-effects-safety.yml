name: Patch V5 Custom Effects Safety
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          echo 'cHl0aG9uIGJhc2U2NA==' | base64 -d > /tmp/patch_effects.py
          python3 /tmp/patch_effects.py
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sv-website-5.html
          git rm .github/workflows/patch-v5-effects-safety.yml
          git commit -m 'Fix V5 custom effects isolation and cleanup'
          git push
