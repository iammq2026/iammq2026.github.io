name: Patch V5 Footer Effects Safety
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch footer safety
        run: python3 .github/patch_v5_footer.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sv-website-5.html
          git rm .github/workflows/patch-v5-footer-safety.yml .github/patch_v5_footer.py
          git commit -m 'Harden V5 footer protection for custom effects'
          git push
